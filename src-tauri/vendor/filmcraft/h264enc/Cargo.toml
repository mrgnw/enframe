[package]
name = "filmcraft-h264enc"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = { path = "../bitstream" }
thiserror = "2"
rayon = { version = "1", optional = true }
