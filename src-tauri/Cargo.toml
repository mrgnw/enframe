[workspace]
members = ["serve", "stabilize", "faces"]
exclude = ["vendor"]

[package]
name = "enframe"
version = "0.1.0"
default-run = "enframe"
edition = "2024"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[example]]
name = "screenshots"
path = "examples/screenshots.rs"
required-features = ["screenshots"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "avif", "tiff", "webp", "rayon"] }
jxl-oxide = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
xcap = { version = "0.8", optional = true }
enigo = { version = "0.6", optional = true }
rawler = "0.7"
faces = { path = "faces" }
sha2 = "0.10"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
screenshots = ["dep:xcap", "dep:enigo"]

[profile.release.package.stabilize]
debug = 1

[profile.dev.package.stabilize]
opt-level = 3
debug-assertions = false
overflow-checks = false
