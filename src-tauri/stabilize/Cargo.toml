[package]
name = "stabilize"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
blake3 = "1.8.7"
filmcraft-h264enc = { path = "../vendor/filmcraft/h264enc" }
filmcraft-isobmff = { path = "../vendor/filmcraft/isobmff" }
kamadak-exif = "0.6.1"
libc = "0.2"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zune-jpeg = "0.5.15"

# Off macOS, build.rs builds libavif and dav1d from source for AVIF input.
[target.'cfg(not(target_os = "macos"))'.build-dependencies]
bindgen = "0.72"
cmake = "0.1.58"
