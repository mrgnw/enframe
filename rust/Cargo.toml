[package]
name = "pinframe"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
kamadak-exif = "0.6.1"
libc = "0.2"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zune-jpeg = "0.5.15"

[build-dependencies]
bindgen = "0.72"
cmake = "0.1.58"

[profile.release]
debug = 1
