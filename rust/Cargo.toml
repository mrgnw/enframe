[package]
name = "pinframe"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
kornia-imgproc = { version = "0.2.0", optional = true }
libc = "0.2"
opencv = { version = "0.101", optional = true, default-features = false, features = ["features", "imgproc", "clang-runtime"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
bindgen = "0.72"
cmake = "0.1.58"

[profile.release]
debug = 1

[dev-dependencies]
kornia-imgproc = "0.2.0"
rayon = "1.12.0"

[features]
# SIFT from kornia-imgproc instead of this crate's port of OpenCV's.
kornia = ["dep:kornia-imgproc"]
# SIFT from OpenCV itself through the opencv crate (needs OpenCV 5 and libclang at build time).
opencv = ["dep:opencv"]
